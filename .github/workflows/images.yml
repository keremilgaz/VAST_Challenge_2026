name: images

# Builds the backend and frontend images and pushes them to GitHub Container
# Registry. They are pulled into Azure Container Registry afterwards with
# `az acr import` (see infra/deploy.sh) - ACR Tasks is not available on an
# Azure for Students subscription, and this keeps image builds off the laptop.

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/**"
      - "infra/docker/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: false
        default: "v1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TAG: ${{ inputs.tag || 'v1' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: vast-backend
            dockerfile: infra/docker/backend.Dockerfile
          - image: vast-frontend
            dockerfile: infra/docker/frontend.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Container Apps runs x86.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
